[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "xdc-compute"
version = "0.1.0"
description = "XDC — consumer-grade distributed AI compute with DiLoCo-style training and pipeline-parallel inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Xiatian AI" }]
keywords = ["distributed-training", "distributed-inference", "diloco", "pipeline-parallelism", "consumer-gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "cryptography>=42",
  "safetensors>=0.4",
  "numpy>=1.26",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.2", "ruff>=0.4"]

[project.scripts]
xdc = "xdc.cli:main"

[project.urls]
Homepage = "https://github.com/NoWint/xdc"
Documentation = "https://github.com/NoWint/xdc/tree/main/docs"
Issues = "https://github.com/NoWint/xdc/issues"

[tool.setuptools.packages.find]
include = ["xdc*"]

[tool.setuptools.package-data]
xdc = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
  "e2e: end-to-end tests that launch real coordinator/worker processes",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"benchmarks/benchmark.py" = ["E402"]
